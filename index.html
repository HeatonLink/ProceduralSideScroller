<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Side Scroller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud" class="hidden">HP: <span id="hp">100</span> | Score: <span id="score">0</span></div>
    <div id="dead" class="overlay hidden">
      <h2>Downed</h2>
      <button id="retry">Retry</button>
    </div>
  </div>
  <script src="js/namespace.js"></script>
  <script src="js/config.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/input.js"></script>
  <script src="js/rig.js"></script>
  <script src="js/characters/player.js"></script>
  <script src="js/characters/enemy.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/level/camera.js"></script>
  <script src="js/level/draw.js"></script>
  <script src="js/level/1/level.js"></script>
  <script src="js/character/player.js"></script>
  <script src="js/enemies/shared.js"></script>
  <script src="js/enemies/one/one.js"></script>
  <script src="js/enemies/two/two.js"></script>
  <script src="js/enemies/three/three.js"></script>
  <script src="js/menu/main.js"></script>
  <script src="js/pause/pause.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
